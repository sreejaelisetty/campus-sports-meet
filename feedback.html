<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Campus Sports Meet 2026</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="sports.html">Sports Events</a>
        <a href="feedback.html">Feedback</a>
    </nav>
</header>

<section class="content">

    <h2>Feedback Form</h2>

    <form id="feedbackForm">

        <input type="text" id="fbName" placeholder="Student Name">

        <input type="text" id="fbReg" placeholder="Register Number">

        <select id="fbEvent">
            <option value="">Select Event</option>
            <option>Football</option>
            <option>Cricket</option>
            <option>Basketball</option>
            <option>Badminton</option>
            <option>Volleyball</option>
        </select>

        <select id="rating">
            <option value="">Select Rating</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
        </select>

        <textarea id="comments" placeholder="Enter Comments"></textarea>

        <button type="submit">Submit Feedback</button>

    </form>

    <p id="feedbackMessage"></p>

    <div id="feedbackList"></div>

    <h3>Average Rating: <span id="average">0</span></h3>

</section>

<footer>
    <p>Campus Sports Meet 2026</p>
</footer>

<script src="script.js"></script>
</body>
</html>
